<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="100%" height="100%" fill="#F7F9FB"/>
  <g id="header">
    <rect x="40" y="20" width="1360" height="88" rx="12" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="80" y="64" font-family="Inter, Arial, sans-serif" font-size="24" fill="#1F2937">Lingua Quest — Prototype Map</text>
    <g transform="translate(1180,30)">
      <rect x="0" y="8" width="240" height="56" rx="8" fill="#00A8A0"/>
      <text x="120" y="46" font-family="Inter" font-size="18" fill="#FFFFFF" text-anchor="middle">Gold: 450 🪙</text>
    </g>
  </g>

  <!-- isometric-like city background (placeholder) -->
  <g id="city" transform="translate(80,140)">
    <rect x="0" y="0" width="1280" height="680" rx="16" fill="#FFFFFF" stroke="#E6EEF6"/>
    <!-- Roads -->
    <rect x="80" y="320" width="1120" height="60" fill="#F0F6FA"/>
    <rect x="560" y="40" width="60" height="600" fill="#F0F6FA"/>

    <!-- Zone 1: Grammar Bridge -->
    <g id="zone1" transform="translate(120,80)">
      <rect x="0" y="0" width="260" height="160" rx="12" fill="#FFFAF0" stroke="#FFD166"/>
      <text x="130" y="92" font-family="Inter" font-size="18" fill="#333" text-anchor="middle">🌉 Grammar Bridge</text>
      <text x="130" y="118" font-family="Inter" font-size="12" fill="#666" text-anchor="middle">Basic grammar mini-game</text>
    </g>

    <!-- Zone 2: Listening Lighthouse -->
    <g id="zone2" transform="translate(920,80)">
      <rect x="0" y="0" width="300" height="160" rx="12" fill="#F0FFF6" stroke="#00A8A0"/>
      <text x="150" y="92" font-family="Inter" font-size="18" fill="#333" text-anchor="middle">🔦 Listening Lighthouse</text>
      <text x="150" y="118" font-family="Inter" font-size="12" fill="#666" text-anchor="middle">Improve your listening</text>
    </g>

    <!-- Zone 3: Word Arena -->
    <g id="zone3" transform="translate(240,420)">
      <rect x="0" y="0" width="340" height="200" rx="12" fill="#FFF5F8" stroke="#FF6B6B"/>
      <text x="170" y="110" font-family="Inter" font-size="18" fill="#333" text-anchor="middle">⚔️ Word Arena</text>
      <text x="170" y="136" font-family="Inter" font-size="12" fill="#666" text-anchor="middle">Fast vocabulary challenges</text>
    </g>

    <!-- Zone 4: Dialogue Train -->
    <g id="zone4" transform="translate(860,420)">
      <rect x="0" y="0" width="300" height="200" rx="12" fill="#F7F9FF" stroke="#2B3A67"/>
      <text x="150" y="110" font-family="Inter" font-size="18" fill="#333" text-anchor="middle">🚂 Dialogue Train</text>
      <text x="150" y="136" font-family="Inter" font-size="12" fill="#666" text-anchor="middle">Practice conversational flow</text>
    </g>

    <!-- Legend / Progress Panel -->
    <g id="panel" transform="translate(480,540)">
      <rect x="0" y="0" width="480" height="120" rx="12" fill="#FFFFFF" stroke="#E6EEF6"/>
      <text x="22" y="36" font-family="Inter" font-size="16" fill="#1F2937">Daily Challenge</text>
      <text x="22" y="66" font-family="Inter" font-size="12" fill="#666">Legendary Expedition — Day 3 available</text>
      <rect x="340" y="36" width="120" height="40" rx="8" fill="#FF6B6B"/>
      <text x="400" y="62" font-family="Inter" font-size="14" fill="#FFF" text-anchor="middle">Play Now</text>
    </g>

  </g>

  <!-- footer nav -->
  <g id="footer" transform="translate(0,820)">
    <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="120" y="52" font-family="Inter" font-size="14" fill="#666">🏠 Home</text>
    <text x="320" y="52" font-family="Inter" font-size="14" fill="#666">🗄️ Vault</text>
    <text x="560" y="52" font-family="Inter" font-size="14" fill="#666">🏪 Store</text>
    <text x="920" y="52" font-family="Inter" font-size="14" fill="#666">👤 Profile</text>
  </g>

</svg>
