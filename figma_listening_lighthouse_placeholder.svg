<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="100%" height="100%" fill="#F0FFF6"/>
  <g id="header">
    <rect x="12" y="12" width="366" height="64" rx="10" fill="#FFFFFF" stroke="#E6F9F4"/>
    <text x="36" y="48" font-family="Inter" font-size="18" fill="#0B6B61">🔦 Listening Lighthouse</text>
    <text x="330" y="48" font-family="Inter" font-size="12" fill="#666" text-anchor="end">Progress 2/10</text>
