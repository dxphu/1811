    <rect x="0" y="144" width="350" height="56" rx="8" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="24" y="180" font-family="Inter" font-size="16" fill="#111">Orange</text>

    <rect x="0" y="216" width="350" height="56" rx="8" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="24" y="252" font-family="Inter" font-size="16" fill="#111">Strawberry</text>
  </g>

  <g id="bottom" transform="translate(0,720)">
