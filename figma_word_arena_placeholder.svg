<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="100%" height="100%" fill="#FFF5F8"/>
  <g id="header">
    <rect x="12" y="12" width="366" height="64" rx="10" fill="#FFFFFF" stroke="#FDEEEF"/>
    <text x="36" y="48" font-family="Inter" font-size="18" fill="#9A2F3F">⚔️ Word Arena</text>
    <text x="330" y="48" font-family="Inter" font-size="12" fill="#666" text-anchor="end">Round 1/3</text>
  </g>

  <g transform="translate(20,100)">
    <rect x="0" y="0" width="350" height="120" rx="12" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="24" y="36" font-family="Inter" font-size="16" fill="#111">Match each word to its picture. Time: 60s</text>
  </g>

  <g id="grid" transform="translate(20,240)">
    <!-- simple placeholders for words and images -->
    <rect x="0" y="0" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="12" y="36" font-family="Inter" font-size="16" fill="#111">apple</text>

    <rect x="190" y="0" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="270" y="36" font-family="Inter" font-size="16" fill="#111" text-anchor="middle">🍎</text>

    <rect x="0" y="80" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="12" y="116" font-family="Inter" font-size="16" fill="#111">dog</text>

    <rect x="190" y="80" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="270" y="116" font-family="Inter" font-size="16" fill="#111" text-anchor="middle">🐶</text>
  </g>

  <g id="bottom" transform="translate(0,720)">
    <rect x="12" y="0" width="366" height="92" rx="12" fill="#FFFFFF" stroke="#E6EEF6"/>
    <text x="28" y="48" font-family="Inter" font-size="14" fill="#666">Time: 00:42</text>
    <rect x="248" y="16" width="120" height="60" rx="8" fill="#FF6B6B"/>
    <text x="308" y="52" font-family="Inter" font-size="16" fill="#FFF" text-anchor="middle">Submit</text>
  </g>
</svg>